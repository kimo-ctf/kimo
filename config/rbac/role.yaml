---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kimo.kimo.io
  resources:
  - challengeinstances
  - challengesets
  - challengetemplates
  - networkfences
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kimo.kimo.io
  resources:
  - challengeinstances/finalizers
  - challengesets/finalizers
  - challengetemplates/finalizers
  - networkfences/finalizers
  verbs:
  - update
- apiGroups:
  - kimo.kimo.io
  resources:
  - challengeinstances/status
  - challengesets/status
  - challengetemplates/status
  - networkfences/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
