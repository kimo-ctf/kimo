apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kimo.fullname" . }}-manager-role
  labels:
    {{- include "kimo.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["kimo.kimo.io"]
  resources: ["challengeinstances", "challengesets", "challengetemplates", "networkfences"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["kimo.kimo.io"]
  resources: ["challengeinstances/finalizers", "challengesets/finalizers", "challengetemplates/finalizers", "networkfences/finalizers"]
  verbs: ["update"]
- apiGroups: ["kimo.kimo.io"]
  resources: ["challengeinstances/status", "challengesets/status", "challengetemplates/status", "networkfences/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kimo.fullname" . }}-manager-rolebinding
  labels:
    {{- include "kimo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kimo.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "kimo.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# The manager runs with --leader-elect, which needs its own namespace-scoped
# permissions on configmaps/leases/events — separate from the ClusterRole
# above, matching controller-runtime's leader election requirements.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kimo.fullname" . }}-leader-election-role
  labels:
    {{- include "kimo.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kimo.fullname" . }}-leader-election-rolebinding
  labels:
    {{- include "kimo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kimo.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "kimo.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
